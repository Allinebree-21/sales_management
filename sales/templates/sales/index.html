<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Sales Management System</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        nav a {
            text-decoration: none;
            color: #007bff;
            background-color: white;
            padding: 12px 20px;
            border-radius: 6px;
            margin: 0 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #e6e6e6;
            transform: scale(1.05);
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>💼 Welcome to Your Sales Management System</h1>
    <p>Track sales, predict profits, and view insights easily.</p>

    <nav>
        <a href="/sales/">📊 View Dashboard</a>
        <a href="/admin/" target="_blank">⚙️ Admin Panel</a>
    </nav>

    <footer>
        © {{ year }} Sales Management | Built with ❤️ using Django
    </footer>
</body>
</html>
